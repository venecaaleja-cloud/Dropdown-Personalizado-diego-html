<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desplegable Personalizado</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor-desplegable">
        <!-- Botón que muestra el estado actual -->
        <button class="boton-desplegable" id="botonDesplegable">
            <span id="textoSeleccionado">Selecciona un elemento</span>
            <span class="flecha" id="iconoFlecha">v</span>
        </button>

        <!-- Lista de opciones (oculta por defecto) -->
        <ul class="menu-desplegable" id="menuDesplegable">
            <li class="elemento-lista" data-valor="Primer elemento">Primer elemento</li>
            <li class="elemento-lista" data-valor="Segundo elemento">Segundo elemento</li>
            <li class="elemento-lista" data-valor="Tercer elemento">Tercer elemento</li>
            <li class="elemento-lista" data-valor="Cuarto elemento">Cuarto elemento</li>
            <li class="elemento-lista" data-valor="Quinto elemento">Quinto elemento</li>
        </ul>
    </div>

    <script src="java.js"></script>
</body>
</html>
